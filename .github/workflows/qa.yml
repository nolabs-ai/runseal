name: QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-qa:
    name: Local Runseal QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout runseal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout nono
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: always-further/nono
          path: nono
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            pkg-config

      - name: Build nono
        working-directory: nono
        run: cargo build --release --locked

      - name: Put nono on PATH
        run: echo "$PWD/nono/target/release" >> "$GITHUB_PATH"

      - name: Run local QA harness
        run: scripts/run-local-qa.sh
        env:
          RUNSEAL_QA_API_TOKEN: ${{ secrets.RUNSEAL_QA_API_TOKEN }}
