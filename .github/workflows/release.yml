name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release binaries
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="runseal-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p dist/pkg
          cp "target/${{ matrix.target }}/release/runseal" dist/pkg/runseal
          chmod 0755 dist/pkg/runseal
          tar -C dist/pkg -czf "dist/${asset}" runseal
          (cd dist && sha256sum "${asset}" > SHA256SUMS)
          echo "asset=dist/${asset}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.asset }}
            dist/SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Runseal ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --clobber

      - name: Verify published assets are installable
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.package.outputs.asset_name }}
        run: |
          set -euo pipefail
          published="$(gh release view "${GITHUB_REF_NAME}" --json assets -q '.assets[].name')"
          for required in "${ASSET}" SHA256SUMS; do
            if ! printf '%s\n' "${published}" | grep -Fxq "${required}"; then
              echo "::error::release ${GITHUB_REF_NAME} is missing required asset '${required}'"
              exit 1
            fi
          done
          gh attestation verify "${{ steps.package.outputs.asset }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-repo "${GITHUB_REPOSITORY}"
          echo "published assets verified: ${published//$'\n'/, }"
