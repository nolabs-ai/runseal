name: Release

on:
  push:
    tags:
      - "v*"

# Serialise reruns for the same tag while a draft is assembled and verified.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build release binaries
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="runseal-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p dist/pkg
          cp "target/${{ matrix.target }}/release/runseal" dist/pkg/runseal
          chmod 0755 dist/pkg/runseal
          tar -C dist/pkg -czf "dist/${asset}" runseal
          (cd dist && sha256sum "${asset}" > SHA256SUMS)
          echo "asset=dist/${asset}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.asset }}
            dist/SHA256SUMS

      - name: Verify draft release publication logic
        run: python3 -m unittest discover -s tests -p 'test_release.py'

      - name: Verify and publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh "${GITHUB_REF_NAME}" "${{ steps.package.outputs.asset }}" dist/SHA256SUMS
