version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # The nono release binary this action installs.
  # Keep its manifest outside .github: the previous updater detected releases
  # but GitHub rejected PR creation with dependency_file_not_supported.
  - package-ecosystem: cargo
    directory: /tooling/nono-version
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(nono)"
    labels:
      - dependencies
      - nono
    allow:
      - dependency-name: nono-cli
