name: Feature request
description: Describe a workload or improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and workload
      description: What are you trying to do, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe necessary permissions, security tradeoffs, and alternatives considered.
    validations:
      required: true
